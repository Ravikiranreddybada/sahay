[project]
name = "sahay"
version = "0.3.0"
description = "Sahay: a grounded, multi-agent healthcare care-assistant (LangGraph + MCP + hybrid RAG + evals)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "anthropic>=0.40",
  "mcp>=2.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "prometheus-client>=0.20",
  "pyyaml>=6",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis[lua]>=2.20", "redis>=5", "langgraph-checkpoint-postgres>=2", "psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
prod = ["redis>=5", "langgraph-checkpoint-postgres>=2", "psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sahay*"]

[tool.setuptools.package-data]
sahay = ["agent/prompts/*.md", "safety/rules/*.yaml"]
