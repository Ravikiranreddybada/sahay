# ---------------- family health records (medicine database decides; consent-scoped)
- id: health-meds-father-flags
  user: U1001
  turns: ["What medicines is papa taking?"]
  expect: {intent: health_records, tools: [get_medication_list], tool_args: {get_medication_list: {member: father}}, must_contain: ["Ecosprin-AV 75", "atorvastatin", "major interaction", "Omez 20", "prescriber"], grounded: true}
- id: health-check-brufen-interactions
  user: U1001
  turns: ["Can papa take Brufen with his medicines?"]
  expect: {intent: health_records, tools: [check_medication_safety], must_contain: ["ibuprofen", "interaction is recorded", "prescriber or pharmacist"], must_not_contain: ["is safe", "you can take"], grounded: true}
- id: health-duplicate-paracetamol-from-order
  user: U1001
  turns: ["can I take Combiflam with my Dolo?"]
