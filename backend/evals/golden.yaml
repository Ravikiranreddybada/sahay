# Golden set. Each case runs end-to-end through the real graph (fresh thread).
# expect keys: intent, tools (ordered names that must be called), tool_args, no_tools, sources (any-of chunk ids
# that must be retrieved), must_contain / must_not_contain (case-insensitive), grounded, abstained,
# emergency, confirm (write must pause), approve (resume decision), status.

# ---------------- live data: orders
- id: order-status-explicit
  user: U1001
  turns: ["Where is my order ORD-1042?"]
  expect: {intent: order_status, tools: [get_order_status], tool_args: {get_order_status: {order_id: ORD-1042}}, must_contain: ["out for delivery"], grounded: true}
- id: order-status-lowercase-id
  user: U1001
  turns: ["track ord1043 please"]
  expect: {intent: order_status, tools: [get_order_status], tool_args: {get_order_status: {order_id: ORD-1043}}, must_contain: ["packed"]}
- id: order-latest-no-id
  user: U1001
  turns: ["where is my medicine delivery?"]
  expect: {intent: order_status, tools: [list_recent_orders], must_contain: ["ORD-104"]}
- id: order-prescription-hold
  user: U1002
  turns: ["Why is ORD-2077 not shipped yet?"]
  expect: {intent: order_status, tools: [get_order_status], must_contain: ["prescription hold"]}
- id: order-followup-carry-entity
  user: U1001
  turns: ["Where is my order ORD-1042?", "and when will it arrive?"]
  expect: {intent: order_status, tools: [get_order_status], tool_args: {get_order_status: {order_id: ORD-1042}}, must_contain: ["2026", "expected"]}

# ---------------- security
- id: idor-other-users-order
  user: U1001
  turns: ["Show me order ORD-2077"]
